    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker

          });

<script>
    (function () {
      const CURRENT_SW = "sw.js?v=38";
      const RESET_FLAG = "tbb:sw-migration:v37";
      const CACHE_PREFIX = "theblackbox-shell-v";

      async function resetLegacyController() {
        if (!("serviceWorker" in navigator) || !("caches" in window) || !window.sessionStorage) {
          return;
        }
        if (sessionStorage.getItem(RESET_FLAG) === "done") {
          return;
        }
        try {
          const controllerUrl =
            (navigator.serviceWorker.controller && navigator.serviceWorker.controller.scriptURL) || "";
          const registrations = await navigator.serviceWorker.getRegistrations();
          const registrationUrls = registrations
            .map(function (registration) {
              return (
                (registration.active && registration.active.scriptURL) ||
                (registration.waiting && registration.waiting.scriptURL) ||
                (registration.installing && registration.installing.scriptURL) ||
                ""
              );
            })
            .filter(Boolean);
          const hasLegacyController =
            (controllerUrl && !controllerUrl.includes(CURRENT_SW)) ||
            registrationUrls.some(function (url) {
              return url && !url.includes(CURRENT_SW);
            });
          if (!hasLegacyController) {
            return;
          }
          sessionStorage.setItem(RESET_FLAG, "done");
          await Promise.all(
            registrations.map(function (registration) {
              return registration.unregister().catch(function () {
                return false;
              });
            }),
          );
          const cacheKeys = await caches.keys();
          await Promise.all(
            cacheKeys
              .filter(function (key) {
                return key.indexOf(CACHE_PREFIX) === 0;
              })
              .map(function (key) {
                return caches.delete(key);
              }),
          );
          window.location.replace(window.location.pathname + window.location.search + window.location.hash);
        } catch (error) {
          console.warn("Service worker migration failed:", error);
        }
      }

      window.addEventListener("load", function () {
        resetLegacyController();
      });
    })();
  </script>
<script>
    (function () {
      const SAFE_ALLOW = "autoplay; fullscreen; encrypted-media; picture-in-picture; clipboard-write";
      const SAFE_SANDBOX = "allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-orientation-lock";

      function setIfDifferent(element, attribute, value) {
        if (element.getAttribute(attribute) !== value) {
          element.setAttribute(attribute, value);
        }
      }

      function rewriteVidKingToProxy(src) {
        try {
          const m = src.match(/^https?:\/\/www\.vidking\.net(\/embed\/.*)/i);
          if (m) return m[1];
        } catch (e) {}
        return null;
      }

      function hardenEmbedFrame() {
        const frame = document.getElementById("embedFrame");
        if (!frame) return;
        const frameSrc = frame.getAttribute("src") || "";
        const proxiedSrc = rewriteVidKingToProxy(frameSrc);
        if (proxiedSrc) {
          frame.setAttribute("src", proxiedSrc);
          return;
        }
        setIfDifferent(frame, "allow", SAFE_ALLOW);
        if (!frame.hasAttribute("allowfullscreen")) {
          frame.setAttribute("allowfullscreen", "true");
        }
        setIfDifferent(frame, "referrerpolicy", "no-referrer");
        setIfDifferent(frame, "sandbox", SAFE_SANDBOX);
      }

      const observer = new MutationObserver(() => {
        hardenEmbedFrame();
      });

      function startGuard() {
        hardenEmbedFrame();
        observer.observe(document.documentElement, {
          childList: true,
          subtree: true,
          attributes: true,
          attributeFilter: ["src"],
        });
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", startGuard, { once: true });
      } else {
        startGuard();
      }

      window.addEventListener("pageshow", hardenEmbedFrame);
    })();
  </script>

  <script>
    /* The compiled bundle player is the VidKing/theater player. It is only
       loaded when it is actually going to be used — i.e. for theater rooms.
       For a normal playback (videasy or a backup provider) player-fullscreen.js
       mounts the embed itself, and letting the bundle boot behind it was
       actively harmful: it points at the dead VidKing embed, gets no player
       events, concludes playback is at 0:00 and then DELETES the title's
       continue-watching entry (and rewrites "recently" with 0 progress) — which
       is what made continue watching look broken even while progress was being
       recorded. It also fought over the URL's ?progress= (dropping resume). */
    (function () {
      try {
        var p = new URLSearchParams(window.location.search);
        var theater = !!(p.get("roomId") || p.get("invite"));
        var wantsBundle = theater || p.get("provider") === "vidking";
        if (!wantsBundle) return;
        var s = document.createElement("script");
        s.type = "module";
        s.crossOrigin = "anonymous";
        s.src = "/assets/player-BQLgXqyv.js";
        document.head.appendChild(s);
      } catch (error) {
        console.warn("Player bundle guard failed", error);
      }
    })();
  </script>
