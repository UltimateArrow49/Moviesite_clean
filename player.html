<!doctype html><html lang="en"><head>
<meta charset="utf-8"/><title>Player</title><meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="/style.css?v=1"/></head>
<body>
<script>const u=new URLSearchParams(location.search).get("src");
const t=new URLSearchParams(location.search).get("title")||"";
const p=new URLSearchParams(location.search).get("poster")||"";
document.title=t?`${t} · Player`:`Player`;
const f=document.querySelector("iframe"); if(u&&f){ f.src=u; }
</script>
<section class="container" style="padding:16px">
  <a href="javascript:history.back()" class="btn" style="text-decoration:none;padding:8px 12px;border:1px solid #2a3a4a;border-radius:8px;color:#9bb4cc">← Back</a>
  <h1 id="title" style="margin:12px 0"></h1>
  <div id="vkWrap" style="display:none;max-width:100%;aspect-ratio:16/9;margin:12px auto;">
    <iframe id="vkFrame" src="" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen
      style="width:100%;height:100%;border:0;border-radius:12px;box-shadow:0 0 24px rgba(0,0,0,.35)"></iframe>
  </div>
  <video id="player" controls preload="metadata" style="width:100%;max-height:70vh;background:black;border-radius:10px"></video>
</section>
<script type="module">
import { vkMovieEmbed, vkTvEmbed } from "/providers/vidking.js";
const u = new URL(location.href);
const mode = u.searchParams.get("vk");
const tmdb = u.searchParams.get("tmdb");
const title = u.searchParams.get("title") || "";
const color = (u.searchParams.get("color")||"3ba0ff").replace(/^#/,"");
const autoPlay = u.searchParams.get("autoPlay") === "true";
const nextEpisode = u.searchParams.get("nextEpisode") === "true";
const episodeSelector = u.searchParams.get("episodeSelector") === "true";
document.getElementById("title").textContent = title;

if (mode === "movie" && tmdb){
  const src = vkMovieEmbed(tmdb, { color, autoPlay });
  document.getElementById("vkWrap").style.display="block";
  document.getElementById("vkFrame").src = src;
  document.getElementById("player").style.display="none";
} else if (mode === "tv" && tmdb){
  const s = parseInt(u.searchParams.get("season")||"1",10) || 1;
  const e = parseInt(u.searchParams.get("episode")||"1",10) || 1;
  const src = vkTvEmbed(tmdb, s, e, { color, autoPlay, nextEpisode, episodeSelector });
  document.getElementById("vkWrap").style.display="block";
  document.getElementById("vkFrame").src = src;
  document.getElementById("player").style.display="none";
} else {
  const file = u.searchParams.get("src");
  if (file) document.getElementById("player").src = "/video/" + encodeURIComponent(file);
}
</script>
</body></html>
