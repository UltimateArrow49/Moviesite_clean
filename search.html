<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Search · theblackbox</title>
  <link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="style.css?v=16">
  <script type="module" src="device.js?v=12"></script>
</head>
<body class="app-shell">
  <header class="topbar">
    <a aria-label="theblackbox home" class="brand" href="index.html">
<svg aria-labelledby="logoTitle logoDesc" role="img" viewbox="0 0 320 88" xmlns="http://www.w3.org/2000/svg">
<title id="logoTitle">theblackbox logotype</title>
<desc id="logoDesc">A stylised neon box with stacked signal bars alongside the theblackbox wordmark.</desc>
<defs>
<lineargradient id="panel" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#12ffb0" stop-opacity="0.8"></stop>
<stop offset="100%" stop-color="#0b6751" stop-opacity="0.95"></stop>
</lineargradient>
<lineargradient id="word" x1="0%" x2="100%" y1="0%" y2="0%">
<stop offset="0%" stop-color="#f7fff9"></stop>
<stop offset="55%" stop-color="#8efed9"></stop>
<stop offset="100%" stop-color="#12ffb0"></stop>
</lineargradient>
<radialgradient cx="50%" cy="50%" id="pulse" r="65%">
<stop offset="0%" stop-color="#14ff9f" stop-opacity="0.3"></stop>
<stop offset="100%" stop-color="#14ff9f" stop-opacity="0"></stop>
</radialgradient>
<filter height="180%" id="glow" width="180%" x="-40%" y="-40%">
<fegaussianblur result="blur" stddeviation="6"></fegaussianblur>
<femerge>
<femergenode in="blur"></femergenode>
<femergenode in="SourceGraphic"></femergenode>
</femerge>
</filter>
</defs>
<g filter="url(#glow)">
<rect fill="#050a08" height="60" rx="18" stroke="#14ff9f" stroke-opacity="0.45" stroke-width="2.5" width="64" x="12" y="14"></rect>
<rect fill="url(#panel)" height="40" rx="12" width="44" x="22" y="24"></rect>
<path d="M33 52h6v-20h-6zm11 12h6V32h-6zm11-20h6v20h-6z" fill="#0f362c" opacity="0.6"></path>
<path d="M33 48h6V32h-6zm11 12h6V28h-6zm11-16h6v16h-6z" fill="#12ffb0"></path>
<circle cx="54" cy="44" fill="url(#pulse)" r="22"></circle>
</g>
<text fill="url(#word)" font-family="'Inter','Segoe UI',sans-serif" font-size="32" font-weight="700" letter-spacing="0.08em" x="96" y="48">
          theblackbox
        </text>
<text fill="rgba(220,247,236,0.7)" font-family="'Inter','Segoe UI',sans-serif" font-size="12" letter-spacing="0.36em" x="96" y="68">
          SHADOW SIGNAL
        </text>
</svg>
</a>
    <nav>
      <a class="btn" href="movies.html">Movies</a>
      <a class="btn" href="series.html">Shows</a>
      <a class="btn" href="live.html">Live</a>
      <a class="btn btn--ghost" href="player.html">Info</a>
    </nav>
    <div class="topbar__actions">
      <form class="search-bar" id="searchForm" action="search.html" method="get">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.71.71l.27.28v.79l5 5 1.5-1.5-5-5Zm-6 0a4.5 4.5 0 1 1 4.5-4.5A4.5 4.5 0 0 1 9.5 14Z"/></svg>
        <input id="search" type="search" name="q" placeholder="Search movies &amp; shows" autocomplete="off" spellcheck="false" aria-label="Search the entire catalog">
      </form>
    </div>
  </header>
  <main class="content content--search" aria-labelledby="searchTitle">
    <section class="search-hero">
      <h1 id="searchTitle">Search everything</h1>
      <p class="search-hero__subtitle">Find films, series, and episodes without switching tabs.</p>
      <div class="search-scope" id="searchScope" role="tablist" aria-label="Search priority">
        <button class="btn btn--ghost search-scope__button" type="button" data-search-scope="movie" role="tab" aria-selected="false">
          Movies First
        </button>
        <button class="btn btn--ghost search-scope__button" type="button" data-search-scope="tv" role="tab" aria-selected="false">
          Shows First
        </button>
      </div>
    </section>
    <p class="search-status" id="searchStatus" role="status" aria-live="polite"></p>
    <section class="search-group" id="movieGroup" aria-labelledby="movieHeading">
      <div class="search-group__header">
        <h2 id="movieHeading">Movies</h2>
        <span class="search-count" id="movieCount"></span>
      </div>
      <div class="search-grid" id="movieResults" role="list"></div>
      <p class="search-empty" id="movieEmpty" hidden>No movies matched that title. Try another keyword.</p>
    </section>
    <section class="search-group" id="showGroup" aria-labelledby="showHeading">
      <div class="search-group__header">
        <h2 id="showHeading">Shows</h2>
        <span class="search-count" id="showCount"></span>
      </div>
      <div class="search-grid" id="showResults" role="list"></div>
      <p class="search-empty" id="showEmpty" hidden>No shows matched that title. Try another keyword.</p>
    </section>
  </main>
  <footer class="site-footer">Independent node · sandboxed embeds · Info relay keeps playback steady.</footer>
  <script defer src="install_app.js?v=12"></script>
  <script src="background_motion.js?v=16" type="module"></script>
  <script type="module" src="search.js?v=11"></script>
</body>
</html>
