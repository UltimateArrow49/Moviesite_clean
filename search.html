<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Search · theblackbox</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon-GWdT6FjN.svg" />
  <meta name="theme-color" content="#050816" />
  <link rel="stylesheet" crossorigin href="/assets/style-Cz-1-Rwo.css" />
  <link rel="stylesheet" href="/theme-modern.css?v=3" />
  <style>
    :root { --s-gutter: clamp(20px, 6vw, 84px); }
    body.search-live { margin: 0; background: var(--bg); color: var(--ink); min-height: 100vh; }

    .s-nav {
      display: flex; align-items: center; gap: 18px;
      padding: 18px var(--s-gutter);
      position: sticky; top: 0; z-index: 5;
      backdrop-filter: blur(20px) saturate(150%);
      background: linear-gradient(180deg, rgba(5,8,22,0.85), rgba(5,8,22,0.4));
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .s-brand { display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:-0.01em; text-decoration:none; color:var(--ink); }
    .s-brand img { width: 28px; height: 28px; }
    .s-links { display:flex; gap:6px; margin-left: 6px; }
    .s-links a {
      padding: 0.5rem 0.95rem; border-radius: 999px; text-decoration:none;
      color: var(--muted); font-weight: 600; font-size: 0.92rem; transition: background .2s, color .2s;
    }
    .s-links a:hover { background: rgba(255,255,255,0.06); color: var(--ink); }

    .s-hero { padding: clamp(28px, 6vw, 64px) var(--s-gutter) 14px; max-width: 1000px; }
    .s-hero h1 { font-size: clamp(1.6rem, 3.5vw, 2.4rem); font-weight: 800; letter-spacing:-0.02em; margin: 0 0 18px; }
    .s-field {
      position: relative; display:flex; align-items:center;
    }
    .s-field svg { position:absolute; left: 18px; width: 20px; height: 20px; color: var(--muted); pointer-events:none; }
    .s-field input {
      width: 100%; font: inherit; font-size: 1.1rem; color: var(--ink);
      padding: 1rem 1.1rem 1rem 3.1rem; border-radius: 16px;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      outline: none; transition: border-color .2s, box-shadow .2s, background .2s;
    }
    .s-field input::placeholder { color: var(--muted); }
    .s-field input:focus {
      background: rgba(255,255,255,0.08);
      border-color: rgba(var(--accent-rgb),0.55);
      box-shadow: 0 0 0 4px rgba(var(--accent-rgb),0.12);
    }

    .s-status { padding: 4px var(--s-gutter); color: var(--muted); font-size: 0.9rem; min-height: 22px; }

    .s-grid {
      display: grid; gap: 18px; padding: 10px var(--s-gutter) 60px;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      max-width: 1500px;
    }
    .s-card { text-decoration: none; color: var(--ink); display:block; transition: transform .22s var(--tm-ease); }
    .s-card:hover { transform: translateY(-6px); }
    .s-poster, .s-poster-ph {
      width: 100%; aspect-ratio: 2/3; border-radius: 14px; object-fit: cover; display:block; margin-bottom: 9px;
      border: 1px solid rgba(255,255,255,0.06); background: rgba(255,255,255,0.04);
      transition: box-shadow .22s, border-color .22s;
    }
    .s-card:hover .s-poster { box-shadow: 0 18px 40px rgba(0,0,0,0.55); border-color: rgba(var(--accent-rgb),0.32); }
    .s-poster-ph { display:grid; place-items:center; color: var(--muted); font-size:0.8rem; text-align:center; padding:8px; }
    .s-name { font-size: 0.9rem; font-weight: 600; line-height: 1.25; }
    .s-sub { font-size: 0.78rem; color: var(--muted); margin-top: 2px; display:flex; gap:8px; align-items:center; }
    .s-badge { padding: 1px 7px; border-radius: 999px; background: rgba(255,255,255,0.08); font-size: 0.7rem; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; }

    .s-empty { padding: 40px var(--s-gutter); color: var(--muted); }
  </style>
</head>
<body class="search-live app-shell">
  <nav class="s-nav">
    <a class="s-brand" href="/movies.html"><img src="/assets/favicon-GWdT6FjN.svg" alt="" />theblackbox</a>
    <div class="s-links">
      <a href="/movies.html">Movies</a>
      <a href="/series.html">Shows</a>
      <a href="/theater.html">Theater</a>
      <a href="/live.html">Live</a>
    </div>
  </nav>
  <header class="s-hero">
    <h1>Search</h1>
    <div class="s-field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="sInput" type="search" placeholder="Search movies & shows…" autocomplete="off" autofocus />
    </div>
  </header>
  <div class="s-status" id="sStatus"></div>
  <div class="s-grid" id="sGrid"></div>
  <div class="s-empty" id="sEmpty" hidden></div>
  <script src="/search-live.js?v=1"></script>
</body>
</html>
