<script>/* fix-media-src-to-cloud */
document.addEventListener('DOMContentLoaded', function () {
  try {
    document.querySelectorAll('a[href*="?src="]').forEach(function(a){
      try {
        var u = new URL(a.getAttribute('href'), location.origin);
        var src = u.searchParams.get('src');
        if(!src) return;
        if(!/^https?:\/\//i.test(src)){
          // strip any  prefix and map via cloud
          src = src.replace(/^\/+media\//,'');
          if (typeof window.mediaUrl === 'function') {
            src = window.mediaUrl(src);
          } else {
            src = '' + encodeURIComponent(src);
          }
        }
        u.searchParams.set('src', src);
        a.setAttribute('href', u.toString());
      } catch(e){ /* noop */ }
    });
  } catch(e){ /* noop */ }
});
</script>
