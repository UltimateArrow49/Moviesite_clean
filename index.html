<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<title>theblackbox · shadow signal</title>
<meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
<link href="site.webmanifest" rel="manifest"/>
<meta content="#14ff9f" name="theme-color"/>
<link href="style.css?v=5" rel="stylesheet"/>
<script type="module" src="device.js"></script>
<script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker
          .register("sw.js")
          .catch(function (error) {
            console.error("Service worker registration failed:", error);
          });
      });
    }
  </script>
</head>
<body class="app-shell home-minimal">
<main aria-labelledby="landing-title" class="landing-screen">
  <div class="landing-card landing-card--minimal">
    <div aria-hidden="true" class="landing-logo">
      <svg role="img" viewBox="0 0 320 88" xmlns="http://www.w3.org/2000/svg">
        <title>theblackbox logotype</title>
        <desc>A stylised neon box with stacked signal bars alongside the theblackbox wordmark.</desc>
        <defs>
          <linearGradient id="panel" x1="0%" x2="100%" y1="0%" y2="100%">
            <stop offset="0%" stop-color="#12ffb0" stop-opacity="0.8"></stop>
            <stop offset="100%" stop-color="#0b6751" stop-opacity="0.95"></stop>
          </linearGradient>
          <linearGradient id="word" x1="0%" x2="100%" y1="0%" y2="0%">
            <stop offset="0%" stop-color="#f7fff9"></stop>
            <stop offset="55%" stop-color="#8efed9"></stop>
            <stop offset="100%" stop-color="#12ffb0"></stop>
          </linearGradient>
          <radialGradient cx="50%" cy="50%" id="pulse" r="65%">
            <stop offset="0%" stop-color="#14ff9f" stop-opacity="0.3"></stop>
            <stop offset="100%" stop-color="#14ff9f" stop-opacity="0"></stop>
          </radialGradient>
          <filter height="180%" id="glow" width="180%" x="-40%" y="-40%">
            <feGaussianBlur result="blur" stdDeviation="6"></feGaussianBlur>
            <feMerge>
              <feMergeNode in="blur"></feMergeNode>
              <feMergeNode in="SourceGraphic"></feMergeNode>
            </feMerge>
          </filter>
        </defs>
        <g filter="url(#glow)">
          <rect fill="#050a08" height="60" rx="18" stroke="#14ff9f" stroke-opacity="0.45" stroke-width="2.5" width="64" x="12" y="14"></rect>
          <rect fill="url(#panel)" height="40" rx="12" width="44" x="22" y="24"></rect>
          <path d="M33 52h6v-20h-6zm11 12h6V32h-6zm11-20h6v20h-6z" fill="#0f362c" opacity="0.6"></path>
          <path d="M33 48h6V32h-6zm11 12h6V28h-6zm11-16h6v16h-6z" fill="#12ffb0"></path>
          <circle cx="54" cy="44" fill="url(#pulse)" r="22"></circle>
        </g>
        <text fill="url(#word)" font-family="'Inter','Segoe UI',sans-serif" font-size="32" font-weight="700" letter-spacing="0.08em" x="96" y="48">
            theblackbox
          </text>
        <text fill="rgba(220,247,236,0.7)" font-family="'Inter','Segoe UI',sans-serif" font-size="12" letter-spacing="0.36em" x="96" y="68">
            SHADOW SIGNAL
          </text>
      </svg>
    </div>
    <h1 class="sr-only" id="landing-title">Browse theblackbox catalogs</h1>
    <nav aria-labelledby="landing-title" class="landing-grid">
      <a class="landing-tile" href="movies.html">
        <span class="landing-tile__label">Movies</span>
        <span class="landing-tile__hint">Feature films &amp; specials</span>
      </a>
      <a class="landing-tile" href="series.html">
        <span class="landing-tile__label">Shows</span>
        <span class="landing-tile__hint">Series &amp; episodes</span>
      </a>
      <a class="landing-tile" href="live.html">
        <span class="landing-tile__label">Live</span>
        <span class="landing-tile__hint">Real-time TV channels</span>
      </a>
      <a class="landing-tile" href="player.html">
        <span class="landing-tile__label">Info</span>
        <span class="landing-tile__hint">Launch playback relay</span>
      </a>
    </nav>
  </div>
</main>
<script defer="" src="install_app.js"></script>
<script src="background_motion.js" type="module"></script>
</body>
</html>
